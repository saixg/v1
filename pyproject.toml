[project]
name = "codeaxis"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
description = "CodeAxis monorepo root (not a distributable package)"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "services/api",
]

[tool.uv.sources]
codeaxis-api = { workspace = true }

[dependency-groups]
dev = [
  "codeaxis-api",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
  "pyright>=1.1.390",
  "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
  "services/api/tests",
  "infra/sandbox/tests",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff.lint.isort]
known-first-party = ["app"]
