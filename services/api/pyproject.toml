[project]
name = "codeaxis-api"
version = "0.1.0"
description = "HTTP surface. Read-only against the Repo Model."
requires-python = ">=3.12,<3.13"
dependencies = [
  "codeaxis-contracts",
  "codeaxis-graph",
  "codeaxis-worker",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "pyjwt[crypto]>=2.9",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeaxis_api"]
