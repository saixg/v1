[project]
name = "codeaxis-api"
version = "0.1.0"
description = "CodeAxis: one modular FastAPI app (api + worker share this codebase). build-plan.md Part 2/12."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "pyjwt[crypto]>=2.9",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.12",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.9",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.7",
  "anthropic>=1.0",
  "httpx>=0.27",
  "detect-secrets>=1.5.0",
  "networkx>=3.7",
  "python-igraph>=1.0.0",
  "leidenalg>=0.12.0",
  # Part 4.F.1 PDF task intake: pure-Python, no JS/action execution, built-in
  # per-stream decompression caps (>=6.0). Text extraction only.
  "pypdf>=6.0",
  # Part 4.F.1 DOCX task intake: parses the OOXML parts with an lxml parser
  # that has entity resolution off; the zip is bomb-checked before it opens.
  "python-docx>=1.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
