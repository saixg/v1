[project]
name = "codeaxis-worker"
version = "0.1.0"
description = "Analysis job runner. The only writer to the Repo Model."
requires-python = ">=3.12,<3.13"
dependencies = [
  "codeaxis-contracts",
  "codeaxis-graph",
  "codeaxis-scan",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeaxis_worker"]
