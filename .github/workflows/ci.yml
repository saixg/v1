name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    # Without this, every test gated on WORKER_DATABASE_URL skips silently
    # (a few hundred of them). pgvector/pgvector is plain Postgres plus the
    # extension that supabase/migrations/20261014000000_repo_model.sql needs.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # DATABASE_URL is the superuser/owner connection some tests need for
      # setup and teardown; the other two are the least-privilege roles the
      # application itself runs as (created by the shim, granted by
      # scripts/setup_db_roles.py).
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      WORKER_DATABASE_URL: postgresql://codeaxis_worker:ci-worker@127.0.0.1:5432/postgres
      API_DATABASE_URL: postgresql://codeaxis_api:ci-api@127.0.0.1:5432/postgres
      # Makes a DB-gated test that skips a failure of the run (see
      # services/api/tests/conftest.py), so this job cannot go green again
      # while quietly executing none of the integration suite.
      CODEAXIS_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Apply migrations (Supabase shim, then supabase/migrations in order)
        run: uv run python scripts/apply_migrations.py --shim

      - name: Create and grant database roles
        run: uv run python scripts/setup_db_roles.py

      - name: Test (pytest)
        run: uv run pytest -q -rs

  node:
    name: Node (build, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build web
        # No NEXT_PUBLIC_API_URL on purpose. The base URL is resolved at
        # runtime from /api/config (src/lib/api.ts), so building without it is
        # the configuration a real deploy uses — and this step proves that
        # path compiles rather than only the baked-in one.
        run: npm run build:web

      - name: Lint web
        run: npm run lint:web

      - name: Test web
        run: npm run test:web

  docker:
    name: Docker (API image builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Builds only. Nothing is pushed to a registry and nothing is run: this
      # job answers one question — does the image a deploy would build still
      # build at all — which no local machine here can answer, since Docker
      # is not installed on the development box.
      #
      # The build context is the workspace root (not services/api) because
      # uv.lock lives there and the Dockerfile's `uv sync --frozen` needs it.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          load: true
          tags: codeaxis-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Asserts the two properties the image is supposed to guarantee and that
      # the Dockerfile-parsing tests under infra/sandbox/tests/ can only claim:
      # it does not run as root, and the git binary the ingest/history
      # analyzers shell out to is actually present.
      - name: Check the image's own contract
        run: |
          set -euo pipefail
          uid="$(docker run --rm --entrypoint id codeaxis-api:ci -u)"
          test "$uid" != "0"
          echo "runs as uid $uid"
          docker run --rm --entrypoint git codeaxis-api:ci --version
          echo "image size: $(docker image inspect codeaxis-api:ci --format '{{.Size}}' | numfmt --to=iec)"
