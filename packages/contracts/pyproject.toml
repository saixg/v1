[project]
name = "codeaxis-contracts"
version = "0.1.0"
description = "Analyzer output contracts: nodes, edges and coverage with required provenance. No I/O."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeaxis_contracts"]
