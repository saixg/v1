[project]
name = "codeaxis-graph"
version = "0.1.0"
description = "Repo Model: Supabase migrations and the typed query layer. The only module that knows SQL."
requires-python = ">=3.12,<3.13"
dependencies = [
  "codeaxis-contracts",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeaxis_graph"]
